<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستوى الإنجاز - Gamified Tasks</title>
    
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4100917417394676" crossorigin="anonymous"></script>

    <style>
        :root {
            --primary: #8e44ad;
            --primary-light: #a29bfe;
            --secondary: #00cec9;
            --bg: #0f172a; /* خلفية داكنة احترافية */
            --card-bg: #1e293b; /* لون الكارت */
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at top, #1e1b4b, var(--bg));
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            color: #fff;
            font-size: 28px;
            margin: 0 0 8px 0;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-shadow: 0 0 15px rgba(142, 68, 173, 0.6);
        }

        .subtitle {
            text-align: center;
            margin: 0 0 25px 0;
            color: var(--text-muted);
            font-size: 14px;
        }

        .stats-container {
            background: rgba(15, 23, 42, 0.6);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 25px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .level-badge {
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .level-number {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            padding: 4px 14px;
            border-radius: 12px;
            font-size: 22px;
            box-shadow: 0 4px 10px rgba(142, 68, 173, 0.3);
        }

        #xp-text {
            margin-top: 12px;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .xp-bar-container {
            background: #334155;
            border-radius: 20px;
            height: 12px;
            width: 100%;
            margin-top: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .xp-bar {
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            height: 100%;
            width: 0%;
            border-radius: 20px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px var(--primary-light);
        }

        .input-section {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 16px;
            background: #334155;
            border: 2px solid transparent;
            border-radius: 14px;
            outline: none;
            font-size: 15px;
            color: #fff;
            transition: all 0.3s ease;
        }

        input[type="text"]::placeholder {
            color: #64748b;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            background: #1e293b;
            box-shadow: 0 0 15px rgba(142, 68, 173, 0.2);
        }

        .btn-add {
            background: linear-gradient(135deg, var(--primary), #732d9b);
            color: white;
            border: none;
            padding: 0 24px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(142, 68, 173, 0.3);
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(142, 68, 173, 0.5);
        }

        .btn-add:active {
            transform: translateY(0);
        }

        .task-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: #334155;
            border-radius: 14px;
            border-right: 4px solid var(--primary);
            animation: slideIn 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
            transition: all 0.3s ease;
        }

        .task-item:hover {
            transform: translateX(-3px);
            background: #3f51b520;
            border-right-color: var(--secondary);
        }

        .task-text {
            font-size: 15px;
            font-weight: 500;
            color: #f1f5f9;
        }

        .btn-complete {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2);
        }

        .btn-complete:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(16, 185, 129, 0.4);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeOut {
            to { opacity: 0; transform: scale(0.9); }
        }
    </style>
</head>
<body>

    <div class="stats-container">
        <div class="level-badge">المستوى <span class="level-number" id="level">1</span></div>
        <div id="xp-text">النقاط (XP): 0 / 100</div>
        <div class="xp-bar-container">
            <div class="xp-bar" id="xp-bar"></div>
        </div>
    </div>

    <div class="input-section">
        <input type="text" id="task-input" placeholder="ما هي مغامرتك القادمة؟...">
        <button class="btn-add" onclick="addTask()">إضافة</button>
    </div>

    <ul class="task-list" id="task-list">
        </ul>
</div>
