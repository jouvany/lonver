<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستوى الإنجاز - Gamified Tasks</title>
    
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4100917417394676" crossorigin="anonymous"></script>

    <style>
        :root {
            --primary: #8e44ad;
            --secondary: #00cec9;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top, #1e1b4b, var(--bg));
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1 {
            margin: 0 0 5px 0;
            font-size: 26px;
            text-shadow: 0 0 10px rgba(142, 68, 173, 0.5);
        }

        .subtitle {
            margin: 0 0 20px 0;
            color: #94a3b8;
            font-size: 14px;
        }

        .stats-container {
            background: rgba(15, 23, 42, 0.5);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .level-badge {
            font-size: 20px;
            font-weight: bold;
        }

        .level-number {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            padding: 2px 10px;
            border-radius: 8px;
        }

        #xp-text {
            margin-top: 10px;
            font-size: 13px;
            color: #94a3b8;
        }

        .xp-bar-container {
            background: #334155;
            border-radius: 10px;
            height: 14px;
            width: 100%;
            margin-top: 8px;
            overflow: hidden;
        }

        .xp-bar {
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            background: #334155;
            border: 2px solid transparent;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        .btn-add {
            background: linear-gradient(135deg, var(--primary), #732d9b);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .task-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #334155;
            border-radius: 12px;
            border-right: 4px solid var(--primary);
            text-align: right;
        }

        .task-text {
            font-size: 15px;
            color: #f1f5f9;
        }

        .btn-complete {
            background: #10b981;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>مستوى الإنجاز ⚔️</h1>
    <p class="subtitle">حوّل مهامك اليومية إلى مغامرة ممتعة</p>

    <div class="stats-container">
        <div class="level-badge">المستوى <span class="level-number" id="level">1</span></div>
        <div id="xp-text">النقاط (XP): 0 / 100</div>
        <div class="xp-bar-container">
            <div class="xp-bar" id="xp-bar"></div>
        </div>
    </div>

    <div class="input-section">
        <input type="text" id="task-input" placeholder="اكتب مهمتك الجديدة هنا...">
        <button class="btn-add" onclick="btnClick()">إضافة</button>
    </div>

    <ul class="task-list" id="task-list"></ul>
</div>

<script>
    var currentXp = 0;
    var currentLevel = 1;

    function btnClick() {
        var inputEl = document.getElementById('task-input');
        var text = inputEl.value.trim();

        if (text === '') return;

        var listEl = document.getElementById('task-list');
        var li = document.createElement('li');
        li.className = 'task-item';
        
        li.innerHTML = '<span class="task-text">' + text + '</span> <button class="btn-complete" onclick="finishTask(this)">تم (+25 XP)</button>';
        
        listEl.appendChild(li);
        inputEl.value = '';
    }

    function finishTask(button) {
        var item = button.parentElement;
        item.remove();
        
        currentXp += 25;
        if (currentXp >= 100) {
            currentXp = currentXp - 100;
            currentLevel += 1;
            alert('🎉 كفوو! ارتقيت إلى المستوى الـ ' + currentLevel + ' بنجاح! 🚀');
        }

        document.getElementById('level').innerText = currentLevel;
        document.getElementById('xp-text').innerText = 'النقاط (XP): ' + currentXp + ' / 100';
        document.getElementById('xp-bar').style.width = currentXp + '%';
    }
</script>

</body>
</html>
