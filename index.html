<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستوى الإنجاز - Gamified Tasks</title>
    
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4100917417394676" crossorigin="anonymous"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-top: 30px;
        }

        h1 {
            text-align: center;
            color: #6c5ce7;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            margin-top: 0;
            color: #777;
            font-size: 14px;
        }

        .stats-container {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid #e9ecef;
        }

        .level-badge {
            font-size: 22px;
            font-weight: bold;
            color: #6c5ce7;
        }

        .xp-bar-container {
            background: #e9ecef;
            border-radius: 10px;
            height: 18px;
            width: 100%;
            margin-top: 10px;
            overflow: hidden;
        }

        .xp-bar {
            background: #6c5ce7;
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
        }

        input[type="text"]:focus {
            border-color: #6c5ce7;
        }

        button.btn-add {
            background-color: #6c5ce7;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .task-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #f8f9fa;
            margin-bottom: 10px;
            border-radius: 8px;
            border-right: 5px solid #6c5ce7;
